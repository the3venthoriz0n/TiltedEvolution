name: Build patched server image

# EXPERIMENT: faster builds. Builds branch sleep-time-advance-fastbuild (same code as sleep-time-advance
# plus a Dockerfile that caches the xmake packages in their own layer) and publishes it to GitHub Container Registry
# (ghcr.io/<owner>/st-reborn-server:sleep-fast). amd64 only. Never writes the :patched or :sleep tags.
# Layer cache: GitHub cache plus a registry cache image (:buildcache-sleep-fast).
on:
  workflow_dispatch:
  push:
    branches:
      - sleep-time-advance-fastbuild

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream tags (needed for the version string)
        run: git fetch --tags https://github.com/tiltedphoques/TiltedEvolution.git || true

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/st-reborn-server" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            GITHUB_ACTIONS=true
            VERSION_OVERRIDE=v1.8.4
          push: true
          tags: ${{ env.IMAGE }}:sleep-fast
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-sleep-fast
            type=gha
          cache-to: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-sleep-fast,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
            type=gha,mode=max,ignore-error=true
