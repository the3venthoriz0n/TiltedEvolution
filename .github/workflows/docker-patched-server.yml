name: Build patched server image

# Builds the server image from this branch and publishes it to GitHub Container Registry
# (ghcr.io/<owner>/st-reborn-server:potions). amd64 only.
on:
  workflow_dispatch:
  push:
    branches:
      - potion-sync

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream tags (needed for the version string)
        run: git fetch --tags https://github.com/tiltedphoques/TiltedEvolution.git || true

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/st-reborn-server" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            GITHUB_ACTIONS=true
            VERSION_OVERRIDE=v1.8.4-potions1
          push: true
          tags: ${{ env.IMAGE }}:potions
          cache-from: type=gha
          cache-to: type=gha,mode=max
