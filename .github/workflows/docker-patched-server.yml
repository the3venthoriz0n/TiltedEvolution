name: Build patched server image

# Builds branch sleep-on-potions (potion-sync plus the Sleep Together server patch) and publishes it to
# GitHub Container Registry
# (ghcr.io/<owner>/st-reborn-server:sleep-potions). amd64 only. Never writes the :potions, :patched or
# :sleep tags. Layer cache: the Dockerfile installs the xmake packages in their own layer; it is cached in
# the GitHub cache and in a registry cache image (:buildcache-sleep-potions), so later builds skip it.
# VERSION_OVERRIDE stays v1.8.4-potions1: the potion client reports that exact version and
# the server refuses clients whose version string differs.
on:
  workflow_dispatch:
  push:
    branches:
      - sleep-on-potions

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream tags (needed for the version string)
        run: git fetch --tags https://github.com/tiltedphoques/TiltedEvolution.git || true

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/st-reborn-server" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            GITHUB_ACTIONS=true
            VERSION_OVERRIDE=v1.8.4-potions1
          push: true
          tags: ${{ env.IMAGE }}:sleep-potions
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-sleep-potions
            type=gha
          cache-to: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-sleep-potions,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
            type=gha,mode=max,ignore-error=true
